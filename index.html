<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>CineVerse — Discover Your Next Favorite Movie</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Fonts: Bebas Neue (marquee display), Inter (body), JetBrains Mono (ticket data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Marquee bulb strip -->
<div class="bulb-strip" aria-hidden="true"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            <span class="brand-mark"><i class="fa-solid fa-film"></i></span>
            CINE<span class="brand-accent">VERSE</span>
        </a>
        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div
            class="collapse navbar-collapse"
            id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        Now Showing
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <p class="eyebrow">Tonight's Feature Presentation</p>
        <h1>Welcome to <span class="brand-accent">CineVerse</span></h1>
        <p class="hero-sub">
            Discover your next favorite movie.
        </p>
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input
                type="text"
                class="form-control search-box"
                placeholder="Search by title, genre, or story...">
        </div>
    </div>
</section>

<!-- Movies -->
<div class="container mt-5">
    <div class="section-head">
        <h2>Latest Movies</h2>
        <div class="filmstrip-divider" aria-hidden="true"></div>
    </div>

    <div class="genre-bar" id="genreBar" aria-label="Filter by genre"></div>

    <div
        class="row"
        id="movieContainer">
    </div>
</div>

<footer class="text-center mt-5">
    <div class="footer-reel" aria-hidden="true"></div>
    <p class="mb-1">🎬 CineVerse</p>
    <p class="mb-0">© 2026 CineVerse. Grab your popcorn.</p>
</footer>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
