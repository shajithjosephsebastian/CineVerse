<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>CineVerse Player</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link
rel="stylesheet"
href="css/style.css">
</head>
<body>

<!-- Marquee bulb strip -->
<div class="bulb-strip" aria-hidden="true"></div>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a
class="navbar-brand"
href="index.html">
<span class="brand-mark"><i class="fa-solid fa-film"></i></span>
CINE<span class="brand-accent">VERSE</span>
</a>
</div>
</nav>

<div class="container">
    <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Now Showing
    </a>
</div>

<div class="container py-4" id="playerPage">

    <!-- Loading skeleton -->
    <div id="playerSkeleton">
        <div class="skeleton-line skeleton-line-title" style="width:50%;"></div>
        <div class="screen-frame mt-4">
            <div class="ratio ratio-16x9">
                <div class="skeleton-card" style="height:100%;"></div>
            </div>
        </div>
        <div class="skeleton-line mt-4" style="width:90%;"></div>
        <div class="skeleton-line" style="width:60%;"></div>
    </div>

    <!-- Populated content -->
    <div class="d-none" id="playerContent">
        <p class="eyebrow">Now Playing</p>
        <h1 id="playerTitle" class="detail-title"></h1>

        <div class="screen-frame mt-4">
            <div class="ratio ratio-16x9">
                <iframe
                    id="videoFrame"
                    allowfullscreen
                    allow="autoplay; encrypted-media"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
        </div>

        <div class="mt-4">
            <div id="playerMeta" class="detail-meta"></div>
            <p id="playerDescription" class="detail-description mt-3"></p>
            <a
                href="index.html"
                class="back-btn d-inline-flex mt-2">
                <i class="fa-solid fa-arrow-left"></i>
                Back Home
            </a>
        </div>
    </div>

    <!-- Not-found state -->
    <div class="error-state d-none" id="playerNotFound">
        <i class="fa-solid fa-film"></i>
        <h3>Feature not found</h3>
        <p>This one isn't in our catalog. It may have left the marquee.</p>
        <a href="index.html" class="watch-btn detail-watch-btn mt-3 d-inline-block">
            <i class="fa-solid fa-arrow-left"></i> Back to Now Showing
        </a>
    </div>

</div>

<footer class="text-center mt-5">
    <div class="footer-reel" aria-hidden="true"></div>
    <p class="mb-1">🎬 CineVerse</p>
    <p class="mb-0">© 2026 CineVerse. Grab your popcorn.</p>
</footer>

<script src="js/player.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
