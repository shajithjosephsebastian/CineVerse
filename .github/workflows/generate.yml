name: Generate Movies Database

on:
  push:
    paths:
      - "imdb_list.json"
      - "scripts/generate_movies.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate movies.json
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          python scripts/generate_movies.py

      - name: Commit generated movies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/movies.json

          git diff --cached --quiet || (
            git commit -m "Auto update movies.json"
            git push
          )
