<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineVerse Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* =========================================
           LOGIN
        ========================================= */

        #loginSection {
            max-width: 420px;
            margin: 100px auto;
            background: #181b23;
            padding: 30px;
            border-radius: 12px;
        }

        #loginSection h1 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            background: #0f1117;
            color: white;
            border: 1px solid #333844;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            background: #e50914;
            color: white;
        }

        .login-button:hover {
            background: #f6121d;
        }

        /* =========================================
           ADMIN
        ========================================= */

        #adminSection {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logout-button {
            background: #292d38;
            color: white;
        }

        .logout-button:hover {
            background: #363b48;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            margin: 0;
            flex: 1;
        }

        .search-button {
            background: #e50914;
            color: white;
        }

        .search-button:hover {
            background: #f6121d;
        }

        /* =========================================
           RESULTS
        ========================================= */

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #181b23;
            border-radius: 10px;
            overflow: hidden;
        }

        .movie-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .movie-year {
            color: #aaa;
            margin-bottom: 10px;
        }

        .movie-overview {
            color: #bbb;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .add-button {
            width: 100%;
            background: #28a745;
            color: white;
        }

        .add-button:hover {
            background: #32bd50;
        }

        .add-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* =========================================
           MESSAGES
        ========================================= */

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            background: #401b1e;
            color: #ff8c93;
        }

        .success {
            background: #173b24;
            color: #78e69a;
        }

        .loading {
            color: #aaa;
            margin: 20px 0;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            .search-box {
                flex-direction: column;
            }

            .top-bar {
                align-items: flex-start;
            }

            #results {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- =========================================
         LOGIN SECTION
    ========================================== -->

    <section id="loginSection">

        <h1>CineVerse Admin</h1>

        <div id="loginError"
             class="message error">
        </div>

        <input
            type="password"
            id="passwordInput"
            placeholder="Admin password"
            autocomplete="current-password"
        >

        <button
            class="login-button"
            id="loginButton">
            Login
        </button>

    </section>


    <!-- =========================================
         ADMIN SECTION
    ========================================== -->

    <section id="adminSection">

        <div class="top-bar">

            <h1>CineVerse Admin</h1>

            <button
                class="logout-button"
                id="logoutButton">
                Logout
            </button>

        </div>


        <div id="message"
             class="message">
        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            >

            <button
                class="search-button"
                id="searchButton">
                Search
            </button>

        </div>


        <div id="loading"
             class="loading"
             style="display:none;">
            Searching TMDb...
        </div>


        <div id="results"></div>

    </section>

</div>


<script>

    // =====================================================
    // CONFIGURATION
    // =====================================================

    const WORKER_URL =
        "https://cineverse-admin.shajithjosephtech.workers.dev";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginSection =
        document.getElementById("loginSection");

    const adminSection =
        document.getElementById("adminSection");

    const passwordInput =
        document.getElementById("passwordInput");

    const loginButton =
        document.getElementById("loginButton");

    const loginError =
        document.getElementById("loginError");

    const logoutButton =
        document.getElementById("logoutButton");

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const results =
        document.getElementById("results");

    const loading =
        document.getElementById("loading");

    const message =
        document.getElementById("message");


    // =====================================================
    // TOKEN
    // =====================================================

    function getToken() {

        return sessionStorage.getItem(
            "cineverse_admin_token"
        );

    }


    function setToken(token) {

        sessionStorage.setItem(
            "cineverse_admin_token",
            token
        );

    }


    function removeToken() {

        sessionStorage.removeItem(
            "cineverse_admin_token"
        );

    }


    // =====================================================
    // SHOW ADMIN
    // =====================================================

    function showAdmin() {

        loginSection.style.display = "none";

        adminSection.style.display = "block";

        searchInput.focus();

    }


    // =====================================================
    // SHOW LOGIN
    // =====================================================

    function showLogin() {

        loginSection.style.display = "block";

        adminSection.style.display = "none";

        passwordInput.focus();

    }


    // =====================================================
    // LOGIN
    // =====================================================

    async function login() {

        const password =
            passwordInput.value.trim();


        if (!password) {

            showLoginError(
                "Please enter your password."
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            const response =
                await fetch(
                    `${WORKER_URL}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                showLoginError(
                    data.error ||
                    "Invalid password."
                );

                return;
            }


            // Save temporary token
            setToken(data.token);

            passwordInput.value = "";

            showAdmin();


        } catch (error) {

            showLoginError(
                "Unable to connect to the server."
            );

        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }


    // =====================================================
    // LOGIN ERROR
    // =====================================================

    function showLoginError(text) {

        loginError.textContent = text;

        loginError.style.display = "block";

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

        removeToken();

        results.innerHTML = "";

        searchInput.value = "";

        hideMessage();

        showLogin();

    }


    // =====================================================
    // SEARCH
    // =====================================================

    async function searchMovies() {

        const query =
            searchInput.value.trim();


        if (query.length < 2) {

            showMessage(
                "Please enter at least 2 characters.",
                "error"
            );

            return;
        }


        const token =
            getToken();


        if (!token) {

            showLogin();

            return;
        }


        loading.style.display = "block";

        results.innerHTML = "";

        hideMessage();


        try {

            const response =
                await fetch(
                    `${WORKER_URL}/search?q=${encodeURIComponent(query)}`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            // Token expired
            if (response.status === 401) {

                removeToken();

                showLogin();

                showLoginError(
                    "Your session has expired. Please log in again."
                );

                return;
            }


            if (!response.ok || !data.success) {

                showMessage(
                    data.error ||
                    "Search failed.",
                    "error"
                );

                return;
            }


            displayResults(
                data.results
            );


        } catch (error) {

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        } finally {

            loading.style.display = "none";

        }

    }


    // =====================================================
    // DISPLAY RESULTS
    // =====================================================

    function displayResults(movieList) {

        results.innerHTML = "";


        if (!movieList || movieList.length === 0) {

            showMessage(
                "No movies found.",
                "error"
            );

            return;
        }


        movieList.forEach(movie => {

            const card =
                document.createElement("div");

            card.className =
                "movie-card";


            const poster =
                movie.poster ||
                "";


            const overview =
                movie.overview ||
                "No description available.";


            card.innerHTML = `

                ${
                    poster
                    ? `<img
                        src="${poster}"
                        alt="${escapeHtml(movie.title)}"
                      >`
                    : ""
                }

                <div class="movie-info">

                    <div class="movie-title">
                        ${escapeHtml(movie.title)}
                    </div>

                    <div class="movie-year">
                        ${movie.year || "Unknown year"}
                    </div>

                    <div class="movie-overview">
                        ${escapeHtml(overview)}
                    </div>

                    <button
                        class="add-button"
                        data-tmdb-id="${movie.tmdb_id}">
                        Add Movie
                    </button>

                </div>
            `;


            const addButton =
                card.querySelector(
                    ".add-button"
                );


            addButton.addEventListener(
                "click",
                () => addMovie(
                    movie.tmdb_id,
                    addButton
                )
            );


            results.appendChild(card);

        });

    }


    // =====================================================
    // ADD MOVIE
    // =====================================================

    async function addMovie(
        tmdbId,
        button
    ) {

        const token =
            getToken();


        if (!token) {

            showLogin();

            return;
        }


        button.disabled = true;

        button.textContent =
            "Adding...";


        try {

            const response =
                await fetch(
                    `${WORKER_URL}/add`,
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        body: JSON.stringify({

                            tmdb_id:
                                tmdbId

                        })
                    }
                );


            const data =
                await response.json();


            // Token expired
            if (response.status === 401) {

                removeToken();

                showLogin();

                showLoginError(
                    "Your session has expired. Please log in again."
                );

                return;
            }


            if (response.status === 409) {

                button.textContent =
                    "Already Added";

                button.style.background =
                    "#555";

                showMessage(
                    "This movie is already in CineVerse.",
                    "error"
                );

                return;
            }


            if (!response.ok || !data.success) {

                showMessage(
                    data.error ||
                    "Failed to add movie.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Add Movie";

                return;
            }


            button.textContent =
                "Added ✓";

            button.style.background =
                "#555";


            showMessage(
                "Movie added successfully. GitHub Actions will now update the site.",
                "success"
            );


        } catch (error) {

            button.disabled = false;

            button.textContent =
                "Add Movie";


            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        }

    }


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `message ${type}`;

        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    // =====================================================
    // EVENTS
    // =====================================================

    loginButton.addEventListener(
        "click",
        login
    );


    passwordInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                login();
            }

        }
    );


    logoutButton.addEventListener(
        "click",
        logout
    );


    searchButton.addEventListener(
        "click",
        searchMovies
    );


    searchInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                searchMovies();
            }

        }
    );


    // =====================================================
    // INITIALIZE
    // =====================================================

    if (getToken()) {

        showAdmin();

    } else {

        showLogin();

    }

</script>

</body>
</html>
