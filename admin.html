<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse Admin</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Fonts: Bebas Neue (marquee display), Inter (body), JetBrains Mono (data/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a10; --bg-deep: #050507; --surface: #161420; --surface-light: #201c2c;
            --gold: #d8a94e; --gold-bright: #f0c869; --crimson: #b23a3a; --crimson-bright: #d24848;
            --green: #3fa66a; --green-bright: #4dc27f; --text: #f5f1e8; --text-muted: #a39b8f;
            --border: rgba(216, 169, 78, .16);
            --font-display: "Bebas Neue", sans-serif; --font-body: "Inter", sans-serif; --font-mono: "JetBrains Mono", monospace;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }

        /* Marquee bulb strip, matching the public site */
        .bulb-strip {
            height: 4px; width: 100%;
            background-image: repeating-radial-gradient(circle at 8px 2px, var(--gold-bright) 0 1.5px, transparent 1.5px 16px);
            background-size: 16px 4px; opacity: .55; animation: bulb-chase 1.6s linear infinite;
        }
        @keyframes bulb-chase { to { background-position: 16px 0; } }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        h1 { margin-bottom: 30px; font-family: var(--font-display); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 400; }
        .brand-mark { color: var(--gold); margin-right: 8px; }
        .eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }

        /* ---------- LOGIN ---------- */
        #loginSection {
            max-width: 420px; margin: 100px auto; background: var(--surface); padding: 34px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 25px 60px rgba(0, 0, 0, .5);
        }
        #loginSection h1 { margin-top: 0; text-align: center; }
        input {
            width: 100%; padding: 13px 15px; margin-bottom: 12px; background: var(--bg-deep); color: var(--text);
            border: 1px solid var(--border); border-radius: 7px; font-size: 15px; font-family: var(--font-body);
        }
        input::placeholder { color: var(--text-muted); }
        input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(216, 169, 78, .15); }
        button {
            border: none; border-radius: 7px; padding: 12px 18px; cursor: pointer; font-size: 14px;
            font-family: var(--font-mono); letter-spacing: .5px; text-transform: uppercase; transition: .2s;
        }
        button:disabled { cursor: not-allowed; opacity: .6; }
        .login-button { width: 100%; background: var(--gold); color: #1a1408; font-weight: 600; }
        .login-button:hover:not(:disabled) { background: var(--gold-bright); }

        /* ---------- ADMIN ---------- */
        #adminSection { display: none; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
            border-bottom: 1px solid var(--border); padding-bottom: 20px;
        }
        .top-bar h1 { margin-bottom: 0; }
        .logout-button { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .logout-button:hover:not(:disabled) { color: var(--text); border-color: var(--gold); }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        .search-box input { margin: 0; flex: 1; }
        .search-button { background: var(--gold); color: #1a1408; font-weight: 600; white-space: nowrap; }
        .search-button:hover:not(:disabled) { background: var(--gold-bright); }

        /* ---------- RESULTS ---------- */
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .movie-card {
            background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
            transition: border-color .25s, transform .25s;
        }
        .movie-card:hover { border-color: var(--gold); transform: translateY(-4px); }
        .movie-card img { width: 100%; height: 320px; object-fit: cover; display: block; }
        .movie-info { padding: 15px; }
        .movie-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
        .movie-year { font-family: var(--font-mono); font-size: .82rem; color: var(--gold); margin-bottom: 10px; }
        .movie-overview { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 15px; }
        .add-button { width: 100%; background: var(--green); color: white; font-weight: 600; }
        .add-button:hover:not(:disabled) { background: var(--green-bright); }
        .add-button:disabled { background: var(--surface-light); color: var(--text-muted); }

        /* ---------- MESSAGES ---------- */
        .message {
            padding: 12px 16px; border-radius: 7px; margin-bottom: 20px; display: none;
            font-family: var(--font-mono); font-size: .85rem; border: 1px solid transparent;
        }
        .error { background: rgba(178, 58, 58, .15); color: #ff9c9c; border-color: rgba(178, 58, 58, .35); }
        .success { background: rgba(63, 166, 106, .15); color: #7fe3aa; border-color: rgba(63, 166, 106, .35); }
        .loading {
            color: var(--text-muted); font-family: var(--font-mono); font-size: .85rem; margin: 20px 0;
            display: flex; align-items: center; gap: 8px;
        }
        .loading::before {
            content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border);
            border-top-color: var(--gold); animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .container { padding: 25px 15px; }
            .search-box { flex-direction: column; }
            .top-bar { align-items: flex-start; flex-direction: column; gap: 14px; }
            #results { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bulb-strip, .loading::before { animation: none; }
        }
    </style>
</head>
<body>

<div class="bulb-strip" aria-hidden="true"></div>

<div class="container">

    <!-- Login gate -->
    <section id="loginSection">
        <p class="eyebrow" style="text-align:center;">Staff Only</p>
        <h1><span class="brand-mark"><i class="fa-solid fa-film"></i></span>CineVerse Admin</h1>
        <div id="loginError" class="message error"></div>
        <input type="password" id="passwordInput" placeholder="Admin password" autocomplete="current-password">
        <button class="login-button" id="loginButton">Login</button>
    </section>

    <!-- Admin panel: search TMDb, add movies to the catalog -->
    <section id="adminSection">
        <div class="top-bar">
            <h1><span class="brand-mark"><i class="fa-solid fa-film"></i></span>CineVerse Admin</h1>
            <button class="logout-button" id="logoutButton">Logout</button>
        </div>
        <div id="message" class="message"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a movie...">
            <button class="search-button" id="searchButton">Search</button>
        </div>
        <div id="loading" class="loading" style="display:none;">Searching TMDb...</div>
        <div id="results"></div>
    </section>

</div>

<script>
    // =====================================================
    // CONFIG + ELEMENT REFS
    // =====================================================
    const WORKER_URL = "https://cineverse-admin.shajithjosephtech.workers.dev";

    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");
    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const logoutButton = document.getElementById("logoutButton");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const results = document.getElementById("results");
    const loading = document.getElementById("loading");
    const message = document.getElementById("message");

    // =====================================================
    // SESSION TOKEN (stored in sessionStorage — cleared when the tab closes)
    // =====================================================
    const getToken = () => sessionStorage.getItem("cineverse_admin_token");
    const setToken = token => sessionStorage.setItem("cineverse_admin_token", token);
    const removeToken = () => sessionStorage.removeItem("cineverse_admin_token");

    function showAdmin() {
        loginSection.style.display = "none";
        adminSection.style.display = "block";
        searchInput.focus();
    }

    function showLogin() {
        loginSection.style.display = "block";
        adminSection.style.display = "none";
        passwordInput.focus();
    }

    // =====================================================
    // LOGIN — POST /login, stores the returned bearer token
    // =====================================================
    async function login() {
        const password = passwordInput.value.trim();
        if (!password) return showLoginError("Please enter your password.");

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const response = await fetch(`${WORKER_URL}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password }),
            });
            const data = await response.json();

            if (!response.ok || !data.success) {
                return showLoginError(data.error || "Invalid password.");
            }

            setToken(data.token);
            passwordInput.value = "";
            showAdmin();
        } catch (error) {
            showLoginError("Unable to connect to the server.");
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    }

    function showLoginError(text) {
        loginError.textContent = text;
        loginError.style.display = "block";
    }

    function logout() {
        removeToken();
        results.innerHTML = "";
        searchInput.value = "";
        hideMessage();
        showLogin();
    }

    // =====================================================
    // SEARCH — GET /search?q=..., requires the bearer token
    // =====================================================
    async function searchMovies() {
        const query = searchInput.value.trim();
        if (query.length < 2) return showMessage("Please enter at least 2 characters.", "error");

        const token = getToken();
        if (!token) return showLogin();

        loading.style.display = "block";
        results.innerHTML = "";
        hideMessage();

        try {
            const response = await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(query)}`, {
                method: "GET",
                headers: { "Authorization": `Bearer ${token}` },
            });
            const data = await response.json();

            if (response.status === 401) {
                removeToken();
                showLogin();
                return showLoginError("Your session has expired. Please log in again.");
            }
            if (!response.ok || !data.success) {
                return showMessage(data.error || "Search failed.", "error");
            }

            displayResults(data.results);
        } catch (error) {
            showMessage("Unable to connect to the server.", "error");
        } finally {
            loading.style.display = "none";
        }
    }

    // =====================================================
    // RENDER SEARCH RESULTS
    // =====================================================
    function displayResults(movieList) {
        results.innerHTML = "";

        if (!movieList || movieList.length === 0) {
            return showMessage("No movies found.", "error");
        }

        movieList.forEach(movie => {
            const card = document.createElement("div");
            card.className = "movie-card";

            const poster = movie.poster || "";
            const overview = movie.overview || "No description available.";

            card.innerHTML = `
                ${poster ? `<img src="${poster}" alt="${escapeHtml(movie.title)}">` : ""}
                <div class="movie-info">
                    <div class="movie-title">${escapeHtml(movie.title)}</div>
                    <div class="movie-year">${movie.year || "Unknown year"}</div>
                    <div class="movie-overview">${escapeHtml(overview)}</div>
                    <button class="add-button" data-tmdb-id="${movie.tmdb_id}">Add Movie</button>
                </div>`;

            const addButton = card.querySelector(".add-button");
            addButton.addEventListener("click", () => addMovie(movie.tmdb_id, addButton));
            results.appendChild(card);
        });
    }

    // =====================================================
    // ADD MOVIE — POST /add { tmdb_id }, requires the bearer token
    // =====================================================
    async function addMovie(tmdbId, button) {
        const token = getToken();
        if (!token) return showLogin();

        button.disabled = true;
        button.textContent = "Adding...";

        try {
            const response = await fetch(`${WORKER_URL}/add`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ tmdb_id: tmdbId }),
            });
            const data = await response.json();

            if (response.status === 401) {
                removeToken();
                showLogin();
                return showLoginError("Your session has expired. Please log in again.");
            }

            if (response.status === 409) {
                button.textContent = "Already Added";
                button.style.background = "#555";
                return showMessage("This movie is already in CineVerse.", "error");
            }

            if (!response.ok || !data.success) {
                showMessage(data.error || "Failed to add movie.", "error");
                button.disabled = false;
                button.textContent = "Add Movie";
                return;
            }

            button.textContent = "Added ✓";
            button.style.background = "#555";
            showMessage("Movie added successfully. GitHub Actions will now update the site.", "success");
        } catch (error) {
            button.disabled = false;
            button.textContent = "Add Movie";
            showMessage("Unable to connect to the server.", "error");
        }
    }

    // =====================================================
    // MESSAGE BANNER + HTML ESCAPE (prevents TMDb data injecting markup)
    // =====================================================
    function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
        message.style.display = "block";
    }
    function hideMessage() { message.style.display = "none"; }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    // =====================================================
    // EVENTS + INIT
    // =====================================================
    loginButton.addEventListener("click", login);
    passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    logoutButton.addEventListener("click", logout);
    searchButton.addEventListener("click", searchMovies);
    searchInput.addEventListener("keydown", e => { if (e.key === "Enter") searchMovies(); });

    if (getToken()) showAdmin(); else showLogin();
</script>

</body>
</html>
